<!DOCTYPE html>
<html lang="en">
<head>

<title>PD 1216 Reviewer — Open Space in Subdivisions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --brick:#5e2c22;
  --brick-2:#733a2c;
  --wheat:#c9962e;
  --wheat-light:#e8c877;
  --forest:#33502f;
  --forest-light:#537a4c;
  --parchment:#f7f0da;
  --parchment-2:#eee0b8;
  --line:#ddc99a;
  --ink:#241d16;
  --ink-soft:#5c5240;
  --sans:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --serif:'Spectral', Georgia, 'Times New Roman', serif;
  --mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--brick);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--wheat-light); color:var(--brick);}

.app{ display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
@media (max-width:900px){ .app{grid-template-columns:1fr;} }

.sidebar{
  background:var(--brick); color:#e9ddd0; padding:28px 20px 24px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  border-right:1px solid rgba(232,200,119,0.18);
}
@media (max-width:900px){
  .sidebar{position:static; height:auto; border-right:none; border-bottom:1px solid rgba(232,200,119,0.18); padding:18px 16px;}
}
.crest{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.crest-mark{
  width:44px;height:44px;flex:0 0 44px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, var(--wheat-light), var(--wheat) 55%, #8a611c 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif); font-weight:700; color:var(--brick); font-size:13px;
  box-shadow:0 0 0 3px rgba(232,200,119,0.15);
}
.crest-text .k1{font-family:var(--serif); font-size:19px; font-weight:600; color:#f7f0da; line-height:1.1;}
.crest-text .k2{font-size:11px; letter-spacing:.04em; color:#c2ac93; margin-top:2px;}

.nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:#a68f76; margin:20px 0 8px; font-weight:600; }
.nav-group-label:first-of-type{margin-top:4px;}
nav.tabs{display:flex; flex-direction:column; gap:2px;}
@media (max-width:900px){ nav.tabs{flex-direction:row; flex-wrap:wrap;} }
.tab-btn{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:7px; font-size:13.5px; color:#d9c8b5;
  transition:background .15s ease, color .15s ease;
}
.tab-btn:hover{background:rgba(232,200,119,0.08); color:#f7f0da;}
.tab-btn.active{background:rgba(232,200,119,0.14); color:#f7f0da; font-weight:600;}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;background:#7a5c47; flex:0 0 6px;}
.tab-btn.active .dot{background:var(--wheat-light);}

.side-foot{ margin-top:26px; padding-top:16px; border-top:1px solid rgba(232,200,119,0.15); font-size:11px; color:#a68f76; line-height:1.6; }

main.content{ background:var(--parchment); min-height:100vh; }
.topbar{
  position:sticky; top:0; z-index:20; background:var(--parchment); border-bottom:1px solid var(--line);
  padding:16px 32px; display:flex; gap:16px; align-items:center;
}
@media (max-width:640px){ .topbar{padding:12px 16px; flex-wrap:wrap;} }
.search-wrap{flex:1; position:relative; max-width:480px;}
.search-wrap input{
  width:100%; padding:10px 14px 10px 36px; border-radius:8px; border:1px solid var(--line);
  background:#fff; font-family:var(--sans); font-size:13.5px; color:var(--ink); outline:none;
}
.search-wrap input:focus{border-color:var(--wheat);}
.search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45;}
.topbar-title{font-family:var(--serif); font-size:15px; color:var(--ink-soft); margin-left:auto; white-space:nowrap;}
@media (max-width:640px){ .topbar-title{display:none;} }

.view{padding:32px; max-width:940px; margin:0 auto;}
@media (max-width:640px){ .view{padding:20px 16px;} }
.view-header{margin-bottom:26px;}
.eyebrow-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.badge-pill{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; background:var(--brick); color:var(--wheat-light); padding:3px 9px; border-radius:20px; }
h1.view-title{font-family:var(--serif); font-size:32px; font-weight:600; margin:0 0 8px; color:var(--brick); line-height:1.15;}
p.view-sub{font-size:14.5px; color:var(--ink-soft); max-width:62ch; line-height:1.6; margin:0;}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:24px 0 30px;}
@media (max-width:700px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
.stat-card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
.stat-card .n{font-family:var(--serif); font-size:24px; color:var(--forest); font-weight:600; line-height:1;}
.stat-card .l{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}

.home-timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:22px; display:flex; flex-direction:column; gap:20px;}
.tl-item{position:relative;}
.tl-item::before{
  content:''; position:absolute; left:-28.5px; top:3px; width:11px; height:11px; border-radius:50%;
  background:var(--wheat); border:2px solid var(--parchment); box-shadow:0 0 0 2px var(--wheat);
}
.tl-date{font-family:var(--mono); font-size:12px; color:var(--forest); font-weight:600;}
.tl-title{font-family:var(--serif); font-size:16.5px; font-weight:600; color:var(--brick); margin:2px 0 3px;}
.tl-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.55; max-width:64ch;}

.quicklinks{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:26px;}
@media (max-width:640px){ .quicklinks{grid-template-columns:1fr;} }
.qlink{ display:block; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; cursor:pointer; transition:border-color .15s, transform .1s; }
.qlink:hover{border-color:var(--wheat);}
.qlink .qt{font-family:var(--serif); font-weight:600; color:var(--brick); font-size:15px;}
.qlink .qd{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}

.article-block{margin-bottom:34px;}
.article-heading{
  font-family:var(--serif); font-size:19px; font-weight:600; color:var(--brick);
  padding-bottom:8px; margin-bottom:14px; border-bottom:2px solid var(--wheat);
  display:flex; align-items:baseline; gap:10px;
}
.article-heading .tag{font-family:var(--mono); font-size:11px; color:var(--forest); font-weight:600;}

.sec-card{ background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.sec-head{ all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; }
.sec-num{ font-family:var(--mono); font-size:12px; color:#fff; background:var(--brick); padding:3px 8px; border-radius:5px; flex:0 0 auto; white-space:nowrap; }
.sec-title{font-family:var(--serif); font-weight:600; font-size:15px; color:var(--ink); flex:1;}
.sec-chevron{transition:transform .2s ease; color:var(--ink-soft); flex:0 0 auto;}
.sec-card.open .sec-chevron{transform:rotate(180deg);}
.sec-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 16px; }
.sec-card.open .sec-body{padding:0 16px 16px;}
.sec-body-inner{font-size:14px; line-height:1.65; color:var(--ink);}
.sec-body-inner p{margin:0 0 10px;}
.sec-body-inner ul{margin:0 0 10px; padding-left:20px;}
.sec-body-inner li{margin-bottom:5px;}
.kw{ background:linear-gradient(transparent 60%, var(--wheat-light) 60%); font-weight:600; }
.trap-box{ background:#eaf0e7; border-left:3px solid var(--forest); border-radius:6px; padding:10px 12px; font-size:13px; color:#20351d; margin-top:8px; display:flex; gap:8px; }
.trap-box .lbl{font-family:var(--mono); font-weight:700; font-size:10.5px; color:var(--forest); white-space:nowrap; padding-top:1px;}

.glossary-grid{display:grid; grid-template-columns:1fr; gap:10px;}
.g-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
.g-term{font-family:var(--serif); font-weight:700; color:var(--brick); font-size:15px;}
.g-abbr{font-family:var(--mono); font-size:11px; color:var(--forest); margin-left:6px;}
.g-def{font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.55;}

.people-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:640px){ .people-grid{grid-template-columns:1fr;} }
.p-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px;}
.p-name{font-family:var(--serif); font-weight:700; color:var(--brick); font-size:16px;}
.p-role{font-size:11.5px; color:var(--forest); font-weight:600; margin:2px 0 8px; text-transform:uppercase; letter-spacing:.03em;}
.p-desc{font-size:13px; color:var(--ink-soft); line-height:1.55;}

.trap-list{display:flex; flex-direction:column; gap:10px;}
.trap-item{ background:#fff; border:1px solid var(--line); border-left:4px solid var(--forest); border-radius:8px; padding:14px 16px; }
.trap-item .tnum{font-family:var(--mono); font-size:11px; color:var(--forest); font-weight:700;}
.trap-item .ttitle{font-family:var(--serif); font-weight:600; font-size:14.5px; color:var(--brick); margin:3px 0 4px;}
.trap-item .tbody{font-size:13.5px; color:var(--ink-soft); line-height:1.55;}

.quiz-box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px;}
.quiz-progress{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
.quiz-q{font-family:var(--serif); font-size:17px; font-weight:600; color:var(--brick); margin-bottom:16px; line-height:1.4;}
.quiz-opts{display:flex; flex-direction:column; gap:8px;}
.quiz-opt{
  all:unset; box-sizing:border-box; cursor:pointer; display:block; padding:11px 14px;
  border:1px solid var(--line); border-radius:8px; font-size:13.5px; transition:border-color .15s, background .15s;
}
.quiz-opt:hover{border-color:var(--wheat);}
.quiz-opt.correct{background:#eaf3ea; border-color:#4c6b52; color:#284a2c; font-weight:600;}
.quiz-opt.wrong{background:#f7e6e1; border-color:#a8452e; color:#5c2317; font-weight:600;}
.quiz-opt.disabled{pointer-events:none;}
.quiz-explain{ margin-top:14px; padding:12px 14px; background:var(--parchment-2); border-radius:8px; font-size:13px; color:var(--ink-soft); line-height:1.55; display:none; }
.quiz-explain.show{display:block;}
.quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
.btn{ all:unset; cursor:pointer; font-family:var(--sans); font-weight:600; font-size:13px; background:var(--brick); color:#f7f0da; padding:10px 18px; border-radius:7px; }
.btn:hover{background:var(--brick-2);}
.btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
.quiz-score{font-family:var(--serif); font-size:22px; color:var(--brick); text-align:center; padding:20px 0;}
.quiz-score .sub{font-family:var(--sans); font-size:13px; color:var(--ink-soft); font-weight:400; margin-top:6px;}

.hidden{display:none !important;}
.nores{padding:40px 0; text-align:center; color:var(--ink-soft); font-size:14px;}
</style>
</head>

<script>
const dates=[{"date": "Jul 12, 1976", "title": "PD 957 approved", "desc": "Subdivision and Condominium Buyers' Protective Decree; original Sec. 31 required roads, alleys, sidewalks and open space, without a fixed percentage."}, {"date": "1976", "title": "PD 953", "desc": "Tree-planting/environmental decree; required at least 30% of a subdivision's total area reserved as open space for parks/recreation — the flat rate PD 1216 later replaced."}, {"date": "Aug 1977 (PD 757)", "title": "National Housing Authority created", "desc": "Consolidated government housing functions/resources into one agency, the NHA — cited in PD 1216's preamble as the agency to certify completed subdivision facilities."}, {"date": "Oct 14, 1977", "title": "PD 1216 signed", "desc": "'Defining Open Space in Residential Subdivisions and Amending Section 31 of PD 957' — signed by Pres. Ferdinand E. Marcos; replaced the flat 30% under PD 953 with density-based percentages (9% / 7% / 3.5%)."}, {"date": "1982", "title": "BP 220", "desc": "Later sets its own, generally lower, parks/playground allocation table for economic and socialized housing, referencing similar density brackets."}, {"date": "1992", "title": "RA 7279 — UDHA", "desc": "Broader urban land-use and socialized-housing law; interacts with subdivision open-space policy for low-income housing."}, {"date": "1986 onward", "title": "HLURB / DHSUD", "desc": "NHA's regulatory functions over subdivision plan approval later shared with/absorbed by HSRC→HLURB (1981/1986) and eventually DHSUD (2019); NHA retains housing production/certification roles relevant to PD 1216 donations."}];
const people=[{"name": "Pres. Ferdinand E. Marcos", "role": "Signed PD 1216 (Oct 14, 1977)", "desc": "Also signed PD 957 (1976), PD 953, and PD 757 (creating the NHA) — the same decree family."}, {"name": "National Housing Authority (NHA)", "role": "Certifies completion of facilities", "desc": "Upon NHA certification, roads, alleys, sidewalks and playgrounds are donated to the city/municipality; PD 1216's preamble cites PD 757 creating the NHA."}, {"name": "City/Municipal Government (LGU)", "role": "Default donee of open space", "desc": "Roads, alleys, sidewalks and playgrounds are donated to the LGU where the subdivision is located, upon completion."}, {"name": "Homeowners' Association (HOA)", "role": "Alternate donee for parks/playgrounds", "desc": "Parks and playgrounds may instead be donated to the HOA, but only with the LGU's consent."}, {"name": "Subdivision owner/developer", "role": "Duty-bearer", "desc": "Must provide adequate roads, alleys and sidewalks, and reserve the required open space percentage, for projects 1 hectare or more."}, {"name": "Lot buyers", "role": "Intended beneficiaries", "desc": "PD 1216's preamble notes the old flat 30% rate raised costs passed on to buyers — the new tiered rates aim to keep housing affordable."}];
const glossary=[{"term": "Open space", "abbr": "Sec. 1", "def": "Area reserved exclusively for parks, playgrounds, recreational uses, schools, roads, places of worship, hospitals, health centers, barangay centers and similar facilities."}, {"term": "Gross area", "abbr": "Sec. 2", "def": "The total subdivision project area, used as the base for computing the 30% and the 9/7/3.5% allocations."}, {"term": "High density / social housing", "abbr": "Sec. 2(a)", "def": "66 to 100 family lots per gross hectare; 9% of gross area for parks/playgrounds."}, {"term": "Medium density / economic housing", "abbr": "Sec. 2(b)", "def": "21 to 65 family lots per gross hectare; 7% of gross area for parks/playgrounds."}, {"term": "Low density / open market housing", "abbr": "Sec. 2(c)", "def": "20 family lots and below per gross hectare; 3.5% of gross area for parks/playgrounds."}, {"term": "Non-alienable", "abbr": "", "def": "Cannot be sold, transferred, or otherwise disposed of — the legal status of donated parks/playgrounds."}, {"term": "Non-buildable", "abbr": "", "def": "No structures may be built on it, subject to narrow exceptions recognized in later implementing rules."}, {"term": "Beyond the commerce of men", "abbr": "Preamble", "def": "Legal phrase meaning the property is outside the scope of ordinary contracts/sale — used to describe open spaces, roads, alleys and sidewalks."}, {"term": "NHA (National Housing Authority)", "abbr": "PD 757", "def": "Certifies completion of subdivision roads/facilities before donation to the LGU."}, {"term": "Donation to LGU", "abbr": "Sec. 2", "def": "Roads, alleys, sidewalks and playgrounds donated to the city/municipality upon NHA certification."}, {"term": "Donation to HOA", "abbr": "Sec. 2", "def": "Alternative donee for parks/playgrounds specifically, but only with LGU consent."}];
const lawArticles=[{"heading": "Section 1 — Definition of Open Space", "tag": "PD 1216", "sections": [{"num": "Definition", "title": "What counts as 'open space'", "body": "<p>An area reserved <span class='kw'>exclusively</span> for: parks, playgrounds, recreational uses, schools, roads, places of worship, hospitals, health centers, barangay centers, and <span class='kw'>other similar facilities and amenities</span>.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>Note how broad this definition is — it covers far more than just 'parks.' Roads, schools, and even places of worship fall under 'open space' as PD 1216 defines it.</span></div>"}]}, {"heading": "Section 2 — Amending Sec. 31 of PD 957", "tag": "Roads, Alleys, Sidewalks and Open Spaces", "sections": [{"num": "Basic duty", "title": "Adequate roads, alleys, sidewalks", "body": "<p>The owner/developer of a subdivision <span class='kw'>shall provide adequate roads, alleys and sidewalks</span> — this duty applies regardless of project size.</p>"}, {"num": "30% threshold trigger", "title": "Projects 1 hectare or more", "body": "<p>For subdivision projects <span class='kw'>one (1) hectare or more</span>, the owner/developer must reserve <span class='kw'>30% of the gross area</span> for open space (roads + parks/playgrounds/recreational areas combined).</p><div class='trap-box'><span class='lbl'>TRAP</span><span>The 30% is the OVERALL open space figure (inclusive of roads etc.). The 9/7/3.5% table below is specifically the PARKS AND PLAYGROUNDS portion, allocated by density — don't confuse the two numbers.</span></div>"}, {"num": "Density-based parks allocation", "title": "9% / 7% / 3.5% of gross area", "body": "<table style='width:100%;border-collapse:collapse'><tr><th>Density Classification</th><th>Family lots per gross hectare</th><th>% of gross area for parks/playgrounds</th></tr><tr><td>High density / social housing</td><td>66–100</td><td>9%</td></tr><tr><td>Medium density / economic housing</td><td>21–65</td><td>7%</td></tr><tr><td>Low density / open market housing</td><td>20 and below</td><td>3.5%</td></tr></table>"}, {"num": "Non-alienable, non-buildable", "title": "Legal character of parks/playgrounds", "body": "<p>Areas reserved for parks, playgrounds, and recreational use are <span class='kw'>non-alienable public land</span> and <span class='kw'>non-buildable</span> — they cannot be sold, and structures generally cannot be built on them (subject to specific exceptions in later HLURB rules, e.g., a basketball court).</p>"}, {"num": "Tree planting", "title": "Included in subdivision plans", "body": "<p>Subdivision plans must include tree planting in designated areas as part of the open space design.</p>"}, {"num": "Donation upon completion", "title": "To the LGU, or to the HOA with consent", "body": "<p>Upon completion and <span class='kw'>certification by the NHA</span>, roads, alleys, sidewalks, and playgrounds shall be <span class='kw'>donated to the city/municipality</span> where the project is located. Parks and playgrounds <span class='kw'>may</span> instead be donated to the Homeowners' Association, but only <span class='kw'>with the consent</span> of the city/municipality.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>Donation is DIRECTLY to the LGU by default — the HOA route is only an alternative, and requires the LGU's consent. It is not automatic.</span></div>"}, {"num": "No conversion", "title": "Permanent dedication", "body": "<p>No portion of the donated parks and playgrounds shall be <span class='kw'>converted to other purposes</span> — this is what makes them 'beyond the commerce of man,' as PD 1216's preamble states.</p>"}]}, {"heading": "Sections 3–4 — Repeal and Effectivity", "tag": "", "sections": [{"num": "Sec. 3", "title": "Repeal of the old 30% flat rate", "body": "<p>Sections 2 and 5 of PD 953 are <span class='kw'>repealed</span> — this removes the old flat 30% rule and replaces it with the density-tiered system of PD 1216.</p>"}, {"num": "Sec. 4", "title": "Effectivity", "body": "<p>The Decree took effect <span class='kw'>immediately</span> upon signing, Oct. 14, 1977.</p>"}]}];
const densityArticles=[{"heading": "Why the Law Changed: PD 953 vs. PD 1216", "tag": "Rationale", "sections": [{"num": "The old rule (PD 953)", "title": "Flat 30% for parks/recreation, regardless of density", "body": "<p>PD 953 required <span class='kw'>at least 30%</span> of the total subdivision area reserved for open space for parks and recreational areas, <span class='kw'>across the board</span> — same rate whether the project was high-density or low-density.</p>"}, {"num": "The problem", "title": "Cost passed on to lot buyers", "body": "<p>PD 1216's preamble explains the 30% flat rate <span class='kw'>increased the acquisition price of lots</span> beyond the reach of the common mass, since developers passed on the cost.</p>"}, {"num": "The fix (PD 1216)", "title": "Tiered percentages calibrated to density", "body": "<p>PD 1216 keeps <span class='kw'>30% overall</span> (roads + open space combined) for projects 1 ha or more, but <span class='kw'>reduces the specific parks/playground share</span> for denser, more affordable housing types (9% high-density down to 3.5% low-density) — making housing more affordable while still preserving environmental/ecological balance.</p>"}]}, {"heading": "Applying the Percentages — Worked Logic", "tag": "Board-exam style reasoning", "sections": [{"num": "Step 1", "title": "Is the project 1 hectare or more?", "body": "<p>If below 1 hectare, the specific 30%/9-7-3.5% reservation rules under Sec. 31 (as amended) do not automatically trigger — but the developer must still provide adequate roads, alleys and sidewalks.</p>"}, {"num": "Step 2", "title": "Classify by density (family lots per gross hectare)", "body": "<p>66–100 lots/ha = high density/social housing (9%); 21–65 = medium/economic (7%); 20 and below = low density/open market (3.5%).</p>"}, {"num": "Step 3", "title": "Distinguish the two numbers", "body": "<p>30% = the OVERALL open space reservation (Sec. 31, roads + parks combined). 9/7/3.5% = the SPECIFIC allocation exclusively for parks, playgrounds and recreational use, within that overall reservation.</p>"}]}];
const relatedArticles=[{"heading": "The Decree Family PD 1216 Belongs To", "tag": "", "sections": [{"num": "PD 957 (1976)", "title": "Subdivision and Condominium Buyers' Protective Decree", "body": "<p>PD 1216 directly amends <span class='kw'>Sec. 31</span> of PD 957 — the open-space/roads/alleys/sidewalks provision. All of PD 957's other buyer-protection provisions remain intact.</p>"}, {"num": "PD 953", "title": "Superseded flat 30% rule", "body": "<p>PD 1216 expressly <span class='kw'>repeals Secs. 2 and 5</span> of PD 953, replacing the flat 30% rate with the density-tiered system.</p>"}, {"num": "PD 757", "title": "Creation of the NHA", "body": "<p>Cited in PD 1216's preamble; the NHA is the certifying agency for completed subdivision facilities before donation to the LGU.</p>"}]}, {"heading": "Later, Overlapping Housing Standards", "tag": "", "sections": [{"num": "BP 220 (1982)", "title": "Economic and socialized housing standards", "body": "<p>Sets its own <span class='kw'>parks and playground allocation table</span> (e.g., 3.5% at 150 lots/ha and below for economic/socialized projects) — a related but <span class='kw'>separate</span> standard from PD 1216's general subdivision rule; BP 220 applies specifically to economic/socialized housing under its own IRR.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>Do not merge BP 220's parks table with PD 1216's — they use different density brackets and apply to different housing tracks (PD 1216 = general/open-market plus tiered; BP 220 = economic/socialized specifically).</span></div>"}, {"num": "RA 7279 (1992)", "title": "Urban Development and Housing Act", "body": "<p>Broader socialized-housing and urban land-use policy; complements but does not replace PD 1216's open-space mandate."}, {"num": "RA 4726", "title": "Condominium Act", "body": "<p>PD 1216 applies to <span class='kw'>residential subdivisions</span>, not condominium projects — condominium open space/common area rules are governed separately under RA 4726.</p>"}, {"num": "HLURB / DHSUD", "title": "Regulatory oversight", "body": "<p>Approves subdivision plans and monitors compliance with the open-space reservation; NHA's certification role for donation remains distinct from HLURB/DHSUD's plan-approval role."}]}];
const traps=[{"t": "The open space requirement is always 30%, regardless of housing type", "b": "False — 30% is the OVERALL reservation (roads+open space) for projects ≥1 ha. The specific parks/playgrounds share is density-based: 9% / 7% / 3.5%."}, {"t": "PD 1216 created the subdivision open-space requirement", "b": "False — PD 953 first imposed a flat 30% rule. PD 1216 amended Sec. 31 of PD 957 and REPLACED PD 953's flat rate with tiered percentages."}, {"t": "The percentages apply to all subdivisions regardless of size", "b": "False — the specific reservation duties trigger for projects one (1) hectare or more."}, {"t": "Donated parks/playgrounds may later be converted to commercial use if the LGU agrees", "b": "False — PD 1216 states no portion of donated parks/playgrounds shall be converted to other purposes, period."}, {"t": "Parks/playgrounds are automatically donated to the Homeowners' Association", "b": "False — the default donee is the city/municipality; HOA donation is only an alternative requiring LGU consent."}, {"t": "High-density housing gets the HIGHEST percentage requirement because it needs less space per person", "b": "Correct rule, but watch the direction — high density/social housing = 9% (the HIGHEST), decreasing down to 3.5% for low-density/open market. Higher density needs MORE shared recreational space per hectare."}, {"t": "PD 1216 applies to condominium projects too", "b": "False — PD 1216 is limited to residential subdivisions; RA 4726 (Condominium Act) governs common areas in condominiums."}, {"t": "BP 220's parks allocation table is the same as PD 1216's", "b": "False — BP 220 sets its own table specific to economic/socialized housing; the brackets and figures are not identical and should not be conflated."}, {"t": "Only the NHA can accept the donation", "b": "False — the donee is the city/municipality (LGU), not the NHA. The NHA's role is to CERTIFY completion of the facilities before donation."}, {"t": "'Open space' under PD 1216 means only parks", "b": "False — Sec. 1's definition is much broader: parks, playgrounds, recreational uses, schools, roads, places of worship, hospitals, health centers, barangay centers, and similar facilities."}];
const quiz=[{"q": "PD 1216 was signed on:", "opts": ["Jul 12, 1976", "Oct 14, 1977", "Mar 25, 1982", "Mar 24, 1992"], "a": 1, "ex": "PD 1216 was signed October 14, 1977."}, {"q": "Which section of PD 957 does PD 1216 amend?", "opts": ["Sec. 20", "Sec. 25", "Sec. 31", "Sec. 39"], "a": 2, "ex": "PD 1216 amends Sec. 31 (Roads, Alleys, Sidewalks and Open Spaces)."}, {"q": "For subdivision projects one hectare or more, the overall open space reservation is:", "opts": ["20%", "25%", "30%", "35%"], "a": 2, "ex": "30% of the gross area, per the amended Sec. 31."}, {"q": "What percentage of gross area is allocated for parks/playgrounds in HIGH density/social housing (66-100 lots/ha)?", "opts": ["3.5%", "7%", "9%", "15%"], "a": 2, "ex": "9% for high density/social housing."}, {"q": "What percentage applies to LOW density/open market housing (20 lots and below per hectare)?", "opts": ["3.5%", "7%", "9%", "12%"], "a": 0, "ex": "3.5% for low density/open market housing."}, {"q": "Which law did PD 1216 repeal insofar as the flat 30% open space rule was concerned?", "opts": ["PD 957", "PD 953", "PD 1096", "PD 1185"], "a": 1, "ex": "PD 1216 repealed Secs. 2 and 5 of PD 953."}, {"q": "Upon completion, roads, alleys, sidewalks and playgrounds are donated to:", "opts": ["The Homeowners' Association automatically", "The National Housing Authority", "The city/municipality", "The HLURB"], "a": 2, "ex": "They are donated to the city/municipality upon NHA certification."}, {"q": "Parks and playgrounds may instead be donated to the Homeowners' Association if:", "opts": ["The developer alone decides", "The city/municipality consents", "The HOA pays a fee", "No approval is needed"], "a": 1, "ex": "This alternative donation requires the consent of the city/municipality."}, {"q": "The legal character of donated parks/playgrounds is:", "opts": ["Alienable and buildable", "Non-alienable and non-buildable", "Alienable but non-buildable", "Non-alienable but freely buildable"], "a": 1, "ex": "They are non-alienable public land and non-buildable."}, {"q": "Under Sec. 1, 'open space' includes all of the following EXCEPT:", "opts": ["Schools", "Places of worship", "Private commercial buildings", "Roads"], "a": 2, "ex": "Private commercial buildings are not part of the Sec. 1 definition of open space."}];
const viewRoot=document.getElementById('viewRoot');const topbarTitle=document.getElementById('topbarTitle');let currentTab='home';let quizIdx=0,quizScore=0,quizAnswered=false;
function accordionHTML(articles){
  return articles.map((art) => `
    <div class="article-block">
      <div class="article-heading"><span>${art.heading}</span><span class="tag">${art.tag}</span></div>
      ${art.sections.map((s) => `
        <div class="sec-card" data-search="${(s.title+' '+s.num+' '+s.body+(s.trap||'')).toLowerCase().replace(/"/g,'&quot;')}">
          <button class="sec-head" onclick="toggleSec(this)">
            <span class="sec-num">${s.num}</span>
            <span class="sec-title">${s.title}</span>
            <svg class="sec-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sec-body"><div class="sec-body-inner">
            ${s.body}
            ${s.trap ? `<div class="trap-box"><span class="lbl">TRAP</span><span>${s.trap}</span></div>` : ''}
          </div></div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function toggleSec(btn){
  const card = btn.closest('.sec-card');
  const body = card.querySelector('.sec-body');
  const isOpen = card.classList.contains('open');
  if(isOpen){
    card.classList.remove('open');
    body.style.maxHeight = null;
  } else {
    card.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 40 + 'px';
  }
}

function renderHome(){topbarTitle.textContent='Overview';viewRoot.innerHTML=`
<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Subdivision Law</span></div><h1 class="view-title">PD 1216 — Open Space in Residential Subdivisions</h1>
<p class="view-sub">Defines "open space," amends Sec. 31 of PD 957, and sets density-based percentages for parks/playgrounds. Relevant to REB Special and Technical and REA Land Management.</p></div>
<div class="stat-row"><div class="stat-card"><div class="n">1977</div><div class="l">Signed Oct 14, 1977</div></div><div class="stat-card"><div class="n">30%</div><div class="l">Overall open space, projects ≥ 1 hectare</div></div><div class="stat-card"><div class="n">9/7/3.5%</div><div class="l">Parks/playgrounds by density (high/med/low)</div></div><div class="stat-card"><div class="n">LGU</div><div class="l">Default donee upon NHA certification</div></div></div>
<div class="quicklinks"><div class="qlink" onclick="switchTab('law')"><div class="qt">Read PD 1216 →</div><div class="qd">Sec. 1 definition, Sec. 2 amendment, donation rules.</div></div><div class="qlink" onclick="switchTab('density')"><div class="qt">Density Logic →</div><div class="qd">Why the percentages changed, and how to apply them.</div></div><div class="qlink" onclick="switchTab('related')"><div class="qt">Related Laws →</div><div class="qd">PD 957, PD 953, PD 757, BP 220, RA 7279, RA 4726.</div></div><div class="qlink" onclick="switchTab('dates')"><div class="qt">Important Dates →</div><div class="qd">1976 to 1992 timeline.</div></div></div>`;}
function renderDates(){topbarTitle.textContent='Important Dates';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">When</span></div><h1 class="view-title">Important Dates</h1><p class="view-sub">Chronology of PD 1216 and the laws around it.</p></div><div class="home-timeline">${dates.map(t=>`<div class="tl-item" data-search="${(t.date+' '+t.title+' '+t.desc).toLowerCase().replace(/"/g,'&quot;')}"><div class="tl-date">${t.date}</div><div class="tl-title">${t.title}</div><div class="tl-desc">${t.desc}</div></div>`).join('')}</div>`;}
function renderPeople(){topbarTitle.textContent='Important People';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Who</span></div><h1 class="view-title">Important People and Institutions</h1><p class="view-sub">Presidents, agencies and stakeholders tied to PD 1216.</p></div><div class="people-grid">${people.map(p=>`<div class="p-card" data-search="${(p.name+' '+p.role+' '+p.desc).toLowerCase().replace(/"/g,'&quot;')}"><div class="p-name">${p.name}</div><div class="p-role">${p.role}</div><div class="p-desc">${p.desc}</div></div>`).join('')}</div>`;}
function renderLaw(){topbarTitle.textContent='PD 1216 — The Decree';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Secs. 1–4</span></div><h1 class="view-title">PD 1216, Section by Section</h1><p class="view-sub">Definition, the amended Sec. 31, and donation mechanics.</p></div><div id="lawSections">${accordionHTML(lawArticles)}</div>`;}
function renderDensity(){topbarTitle.textContent='Density Logic';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Rationale</span></div><h1 class="view-title">Why Density-Based Percentages</h1><p class="view-sub">From flat 30% to tiered 9/7/3.5% — and how to apply it.</p></div><div id="densitySections">${accordionHTML(densityArticles)}</div>`;}
function renderRelated(){topbarTitle.textContent='Related Laws';viewRoot.innerHTML=`<div class="view-header"><div class="eyebrow-row"><span class="badge-pill">Distinctions</span></div><h1 class="view-title">Related Laws</h1><p class="view-sub">PD 957, PD 953, PD 757, BP 220, RA 7279, RA 4726.</p></div><div id="relatedSections">${accordionHTML(relatedArticles)}</div>`;}
function renderGlossary(){
  topbarTitle.textContent = 'Glossary';
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Terms</span></div>
      <h1 class="view-title">Glossary of Terms</h1>
      <p class="view-sub">Open space, density and donation terms in one place.</p>
    </div>
    <div class="glossary-grid">
      ${glossary.map(g => `
        <div class="g-card" data-search="${(g.term+' '+g.abbr+' '+g.def).toLowerCase().replace(/"/g,'&quot;')}">
          <span class="g-term">${g.term}</span><span class="g-abbr">${g.abbr}</span>
          <div class="g-def">${g.def}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTraps(){
  topbarTitle.textContent = 'Board Exam Traps';
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Percentage and donation gotchas</span></div>
      <h1 class="view-title">Board Exam Traps</h1>
      <p class="view-sub">30% vs. density-based percentages, donee confusion, and non-alienable vs. non-buildable mix-ups.</p>
    </div>
    <div class="trap-list">
      ${traps.map((t,i) => `
        <div class="trap-item" data-search="${(t.t+' '+t.b).toLowerCase().replace(/"/g,'&quot;')}">
          <div class="tnum">TRAP ${i+1}</div>
          <div class="ttitle">${t.t}</div>
          <div class="tbody">${t.b}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderQuiz(reset){
  topbarTitle.textContent = 'Self-Test Quiz';
  if(reset){ quizIdx = 0; quizScore = 0; }
  quizAnswered = false;

  if(quizIdx >= quiz.length){
    viewRoot.innerHTML = `
      <div class="view-header">
        <div class="eyebrow-row"><span class="badge-pill">Results</span></div>
        <h1 class="view-title">Quiz Complete</h1>
      </div>
      <div class="quiz-box">
        <div class="quiz-score">${quizScore} / ${quiz.length} correct
          <div class="sub">${quizScore === quiz.length ? "Perfect score — ready for the board." : quizScore/quiz.length >= 0.7 ? "Solid — review the misses below and go again." : "Keep drilling the percentage table and dates, then retake."}</div>
        </div>
        <div class="quiz-nav" style="justify-content:center;">
          <button class="btn" onclick="renderQuiz(true)">Retake Quiz</button>
        </div>
      </div>
    `;
    return;
  }

  const item = quiz[quizIdx];
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Self-Test</span></div>
      <h1 class="view-title">PD 1216 Quiz</h1>
      <p class="view-sub">Questions on PD 1216, its amendment of PD 957, and the density-based percentages.</p>
    </div>
    <div class="quiz-box">
      <div class="quiz-progress">Question ${quizIdx+1} of ${quiz.length} &nbsp;·&nbsp; Score so far: ${quizScore}</div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts">
        ${item.opts.map((o,i) => `<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="quizExplain">${item.ex}</div>
      <div class="quiz-nav">
        <button class="btn ghost" onclick="renderQuiz(true)">Restart</button>
        <button class="btn" id="quizNextBtn" style="opacity:.4; pointer-events:none;" onclick="nextQuiz()">Next →</button>
      </div>
    </div>
  `;
}

function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const item = quiz[quizIdx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if(idx === item.a) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
  });
  if(i === item.a) quizScore++;
  document.getElementById('quizExplain').classList.add('show');
  const nb = document.getElementById('quizNextBtn');
  nb.style.opacity = 1;
  nb.style.pointerEvents = 'auto';
}

function nextQuiz(){
  quizIdx++;
  renderQuiz(false);
}

/* ============================================================
   TAB SWITCHING + SEARCH
   ============================================================ */
const renderers = {
  home: renderHome, law: renderLaw, density: renderDensity, related: renderRelated,
  dates: renderDates, people: renderPeople, glossary: renderGlossary, traps: renderTraps,
  quiz: () => renderQuiz(true)
};

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('searchInput').value = '';
  renderers[tab]();
  window.scrollTo(0,0);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const searchable = document.querySelectorAll('[data-search]');
  if(!q){
    searchable.forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.article-block, .article-heading').forEach(el => el.classList.remove('hidden'));
    const nores = document.getElementById('noResults');
    if(nores) nores.remove();
    return;
  }
  let anyVisible = false;
  searchable.forEach(el => {
    const match = el.dataset.search.includes(q);
    el.classList.toggle('hidden', !match);
    if(match) anyVisible = true;
    if(match && el.classList.contains('sec-card')){
      el.classList.add('open');
      const body = el.querySelector('.sec-body');
      if(body) body.style.maxHeight = body.scrollHeight + 40 + 'px';
    }
  });
  let nores = document.getElementById('noResults');
  if(!anyVisible){
    if(!nores){
      nores = document.createElement('div');
      nores.id = 'noResults';
      nores.className = 'nores';
      nores.textContent = 'No matches in this section. Try another tab.';
      viewRoot.appendChild(nores);
    }
  } else if(nores){
    nores.remove();
  }
});

/* init */
renderHome();
</script>
</body>
</html>
